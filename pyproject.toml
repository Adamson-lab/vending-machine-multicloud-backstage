[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vendingctl"
version = "0.1.0"
description = "Validate, compile and govern cloud container requests for AWS, Azure and GCP"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0", "jsonschema>=4.20"]

[project.optional-dependencies]
# Test-only tools. jinja2 renders the Backstage skeleton in tests/test_backstage_template.py.
dev = ["pytest>=8.0", "jinja2>=3.1"]

[project.scripts]
vendingctl = "vendingctl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
