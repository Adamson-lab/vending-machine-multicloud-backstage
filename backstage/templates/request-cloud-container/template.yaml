apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: request-cloud-container
  title: Request a governed cloud container
  description: >-
    Request an AWS account, Azure subscription or GCP project. This opens a pull request
    with a validated request file; nothing is created until the pull request is reviewed
    and merged.
  tags:
    - cloud
    - governance
    - vending
spec:
  owner: group:default/platform-team
  type: resource
  parameters:
    - title: Workload
      required:
        - workload_name
        - owner_email
        - owner_first_name
        - owner_last_name
        - cost_center
      properties:
        workload_name:
          title: Workload name
          type: string
          description: Lowercase letters, digits and hyphens, 3 to 24 characters, starting with a letter.
          pattern: ^[a-z][a-z0-9-]{2,23}$
          ui:autofocus: true
        owner_email:
          title: Owner email
          type: string
          pattern: ^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$
        owner_first_name:
          title: Owner first name
          type: string
          minLength: 1
          maxLength: 40
          pattern: ^[^"\\\n]+$
        owner_last_name:
          title: Owner last name
          type: string
          minLength: 1
          maxLength: 40
          pattern: ^[^"\\\n]+$
        cost_center:
          title: Cost center
          type: string
          description: Finance cost center, for example cc-1042.
          pattern: ^cc-[0-9]{3,6}$
    - title: Classification and placement
      required:
        - environment
        - data_classification
        - jurisdiction
        - clouds
      properties:
        environment:
          title: Environment
          type: string
          enum: [prod, nonprod, dev, sandbox]
          default: nonprod
        data_classification:
          title: Data classification
          type: string
          description: The highest classification of data the workload will hold. Confidential and restricted data are not allowed in sandbox.
          enum: [public, internal, confidential, restricted]
          default: internal
        jurisdiction:
          title: Jurisdiction
          type: string
          enum: [eu, us, uk]
          default: eu
        clouds:
          title: Clouds
          type: array
          uniqueItems: true
          minItems: 1
          items:
            type: string
            enum: [aws, azure, gcp]
          ui:widget: checkboxes
        azure_landing_zone:
          title: Azure landing zone
          type: string
          description: Required for Azure outside sandbox. Corp is private-only, online is internet-facing.
          enum: [corp, online]
        internet_ingress:
          title: Internet ingress required
          type: boolean
          default: false
        exception_ref:
          title: Approved exception reference
          type: string
          description: Needed only for restricted data with internet ingress, for example EXC-123.
          pattern: ^EXC-[0-9]{3,5}$
    - title: Budget and timing
      required:
        - requested_on
      properties:
        requested_on:
          title: Date needed
          type: string
          description: Sandbox expiry is counted from this date.
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
          ui:widget: date
        monthly_budget_usd:
          title: Monthly budget (USD)
          type: number
          description: Required for production or restricted data and for sandbox (maximum set by policy).
          exclusiveMinimum: 0
        sandbox_ttl_days:
          title: Sandbox lifetime (days)
          type: integer
          description: Sandbox only. Maximum set by policy.
          minimum: 1
          maximum: 90
        gcp_viewer_group:
          title: GCP viewer group email
          type: string
          description: Optional. Group given read access to the GCP project.
          pattern: ^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$
  steps:
    - id: render
      name: Render request file
      action: fetch:template
      input:
        url: ./skeleton
        values:
          workload_name: ${{ parameters.workload_name }}
          owner_email: ${{ parameters.owner_email }}
          owner_first_name: ${{ parameters.owner_first_name }}
          owner_last_name: ${{ parameters.owner_last_name }}
          cost_center: ${{ parameters.cost_center }}
          environment: ${{ parameters.environment }}
          data_classification: ${{ parameters.data_classification }}
          jurisdiction: ${{ parameters.jurisdiction }}
          clouds: ${{ parameters.clouds }}
          azure_landing_zone: ${{ parameters.azure_landing_zone }}
          internet_ingress: ${{ parameters.internet_ingress }}
          exception_ref: ${{ parameters.exception_ref }}
          requested_on: ${{ parameters.requested_on }}
          monthly_budget_usd: ${{ parameters.monthly_budget_usd }}
          sandbox_ttl_days: ${{ parameters.sandbox_ttl_days }}
          gcp_viewer_group: ${{ parameters.gcp_viewer_group }}
    - id: pull-request
      name: Open pull request
      action: publish:github:pull-request
      input:
        # Change owner and repo to the repository that holds your requests/ directory.
        repoUrl: github.com?owner=Adamson-lab&repo=vending-machine-multicloud-backstage
        branchName: request-${{ parameters.workload_name }}-${{ parameters.environment }}
        title: "Request: ${{ parameters.workload_name }}-${{ parameters.environment }} on ${{ parameters.clouds | join(', ') }}"
        description: |
          Container request created from the Backstage template.

          - Workload: ${{ parameters.workload_name }} (${{ parameters.environment }})
          - Data classification: ${{ parameters.data_classification }}
          - Jurisdiction: ${{ parameters.jurisdiction }}
          - Clouds: ${{ parameters.clouds | join(', ') }}

          Automated checks validate the request and label the pull request with the approvals it needs.
  output:
    links:
      - title: Review the pull request
        url: ${{ steps['pull-request'].output.remoteUrl }}
